# Linux deployment sketch for after the weekend. NOT used at Cal Hacks: on the Mac every service runs
# natively via `make dev` (Docker on macOS has no GPU access). Agents create the Dockerfiles when deploying.
# Video frames stay on Redis + the recorder; SpacetimeDB holds metadata only (D-21).
x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]

services:
  redis: {image: "redis:7"}
  spacetimedb: {build: ./spacetime, ports: ["3000:3000"], volumes: ["spacetime-data:/var/lib/spacetime"]}
  gateway: {build: ./services/gateway, env_file: .env, depends_on: [redis]}
  recorder: {build: ./services/recorder, env_file: .env, depends_on: [redis], volumes: ["./data/local:/data/local"]}
  courtcam-adapter: {build: ./services/courtcam-adapter, env_file: .env}
  flight: {build: ./services/flight, <<: *gpu, env_file: .env, depends_on: [redis, spacetimedb]}
  engine: {build: ./services/engine, env_file: .env, depends_on: [redis, spacetimedb]}
  compiler: {build: ./services/compiler, env_file: .env, depends_on: [spacetimedb]}
  rules: {build: ./services/rules, env_file: .env}
  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./apps/pwa/dist:/srv/cam:ro
      - ./apps/dashboard/dist:/srv/dashboard:ro
      - caddy-data:/data
    env_file: .env
    depends_on: [gateway]

volumes:
  spacetime-data:
  caddy-data:
