<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Table corner selection</title>
  <style>
    :root{font:14px system-ui,sans-serif;color:#e9edf4;background:transparent;color-scheme:dark}
    *{box-sizing:border-box}body{margin:0}p{margin:0 0 10px;line-height:1.5;min-height:42px}
    .image{position:relative;width:100%;border:1px solid #465263;border-radius:8px;overflow:hidden;background:#151b23}
    img{display:block;width:100%;height:auto;user-select:none;pointer-events:none}
    svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
    polygon{fill:#58dbc82b;stroke:#58dbc8;stroke-width:2;vector-effect:non-scaling-stroke;pointer-events:none}
    circle{fill:#10242b;stroke:#77ffe5;stroke-width:2.5;cursor:grab;vector-effect:non-scaling-stroke}
    text{fill:white;font-weight:700;text-anchor:middle;dominant-baseline:central;pointer-events:none}
    .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
    button{border:1px solid #526077;border-radius:6px;padding:7px 12px;background:#202b3a;color:inherit;cursor:pointer}
    button:disabled{opacity:.4;cursor:default}button:focus-visible{outline:2px solid #77ffe5;outline-offset:2px}
    .count{margin-left:auto;font-size:12px;color:#a5b5c5}
  </style>
</head>
<body>
  <p id="instruction" role="status" aria-live="polite">Click corner A on the table.</p>
  <div class="image"><img id="frame" alt="Camera frame for selecting table corners" draggable="false"><svg id="surface" aria-label="Click the table corners A, B, C, D in order"></svg></div>
  <div class="toolbar"><button id="undo" type="button" disabled>Undo last corner</button><button id="reset" type="button" disabled>Reset corners</button><span id="count" class="count">0 / 4 corners</span></div>
  <script type="module" src="picker.js"></script>
</body>
</html>
