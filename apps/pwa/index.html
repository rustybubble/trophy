<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1115" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <title>Trophy</title>
    <script>
      // A phone that can't run the app shows why (and tells the gateway) instead of a blank page.
      (function () {
        var shown = false;
        function report(m) {
          m = String(m).slice(0, 2000);
          try {
            navigator.sendBeacon(
              "/api/client_log",
              new Blob([JSON.stringify({ msg: m, ua: navigator.userAgent, url: location.pathname })], {
                type: "application/json",
              }),
            );
          } catch (e) {}
          var root = document.getElementById("root");
          if (!shown && root && !root.childElementCount) {
            shown = true;
            var pre = document.createElement("pre");
            pre.style.cssText = "white-space:pre-wrap;color:#fca5a5;padding:16px;font:13px ui-monospace,monospace";
            pre.textContent = "Trophy could not start on this phone:\n" + m;
            document.body.appendChild(pre);
          }
        }
        window.addEventListener(
          "error",
          function (e) {
            var t = e.target;
            if (t && t !== window && (t.src || t.href)) report("failed to load " + (t.src || t.href));
            else report((e.message || "error") + " @ " + (e.filename || "") + ":" + (e.lineno || ""));
          },
          true,
        );
        window.addEventListener("unhandledrejection", function (e) {
          var r = e.reason;
          report("unhandled: " + ((r && (r.stack || r.message)) || r));
        });
        setTimeout(function () {
          var root = document.getElementById("root");
          if (root && !root.childElementCount) report("nothing rendered after 10 s");
        }, 10000);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
