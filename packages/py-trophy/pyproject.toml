[project]
name = "trophy"
version = "1.0.0"
description = "Trophy shared Python library: contracts (generated), ids, timebase, frame bus, streams, tracks, world (Spacetime observation writer)."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "redis>=5",
    "python-ulid>=2",
    "pillow>=11",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff==0.14.5",
    "fakeredis>=2.26",
    "datamodel-code-generator==0.86.0",
    "jsonschema>=4.23",
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trophy"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["trophy/contracts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
