[project]
name = "rulebook-scraper"
version = "0.1.0"
description = "Apify actor: Sports Rulebook Scraper. Official rulebook pages and PDFs -> one dataset item per rule clause."
requires-python = ">=3.11"
dependencies = [
    "apify>=4.1,<5",
    "crawlee[beautifulsoup]>=1.11,<2",
    "beautifulsoup4>=4.13",
    "pypdf>=6,<7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff==0.14.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rulebook_scraper"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
