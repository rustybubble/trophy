name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: py-trophy lint + tests
        working-directory: packages/py-trophy
        run: |
          uv sync --frozen
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen pytest -q
      - name: gateway lint + tests
        working-directory: services/gateway
        run: |
          uv sync --frozen
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen pytest -q
      - name: live evaluation lint + tests
        run: |
          uv run --project packages/py-trophy --frozen ruff check tools/eval_live.py tests/test_eval_live.py
          uv run --project packages/py-trophy --frozen python -m pytest -q tests/test_eval_live.py
      - name: recorder lint + tests
        run: |
          uv sync --frozen --project services/recorder
          uv run --project services/recorder --frozen ruff check services/recorder
          uv run --project services/recorder --frozen ruff format --check services/recorder
          uv run --project services/recorder --frozen pytest -q services/recorder/tests
      - name: flight lint + tests
        if: hashFiles('services/flight/pyproject.toml') != ''
        working-directory: services/flight
        run: |
          uv sync --frozen
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen pytest -q
      - name: engine lint + tests (sport modules, replay_test gate, synthetic fixtures)
        working-directory: services/engine
        run: |
          uv sync --frozen
          uv run --frozen ruff check . ../../sports
          uv run --frozen ruff format --check .
          uv run --frozen pytest -q
          uv run --frozen replay-test --module ../../sports/table_tennis --samples ../../evals/fixtures/synthetic/table_tennis --quiet
      - name: referee lint + tests
        working-directory: services/referee
        run: |
          uv sync --frozen
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen pytest -q
      - name: py-trophy imports on 3.12
        working-directory: packages/py-trophy
        run: |
          uv venv --python 3.12 /tmp/py312
          uv pip install --python /tmp/py312 .
          /tmp/py312/bin/python -c "import trophy.world, trophy.framebus, trophy.contracts"
      - name: scripts lint + fixture validation
        run: |
          uv run --project packages/py-trophy --frozen ruff check scripts spacetime/scripts infra
          uv run --project packages/py-trophy --frozen python scripts/validate_fixtures.py

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: engine venv for the compiler's run-loop tests (scripted agent + the real replay_test gate; no Factory key needed)
        working-directory: services/engine
        run: uv sync --frozen
      - run: npm test
      - run: npm run build -w @trophy/pwa
      - run: npm run build -w @trophy/dashboard

  codegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: npm ci
      - run: cd packages/py-trophy && uv sync --frozen
      - name: make contracts + fixtures, then fail on any diff
        run: |
          node scripts/gen-contracts.mjs
          node --experimental-strip-types packages/state-client/scripts/build-fixtures.ts
          git diff --exit-code -- packages/contracts/gen packages/py-trophy/trophy/contracts packages/state-client/fixtures
