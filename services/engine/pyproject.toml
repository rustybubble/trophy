[project]
name = "trophy-engine"
version = "0.1.0"
description = "Trophy engine (Agent 3): sport modules (config.yaml + events.py + rules.yaml), the loader with its import allowlist, replay_test (the Droid's test gate) and the synthetic layer-1 generator. Rule evaluation and scoring arrive in stage 2."
requires-python = ">=3.11"
dependencies = [
    "trophy",
    "pyyaml>=6",
    "jsonschema>=4.23",
    "cel-python==0.5.0",
    "anthropic>=2.3,<3",
    "openai>=3.37,<4",
    "httpx>=0.28",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "redis>=5",
]

[project.scripts]
replay-test = "trophy_engine.replay_test.cli:main"
trophy-synth = "trophy_engine.synth.generate:main"
trophy-synth3d = "trophy_engine.synth.track3d:main"
check-test = "trophy_engine.check_test.cli:main"
trophy-engine = "trophy_engine.loop:main"
trophy-ctl = "trophy_engine.ctl_cli:main"
trophy-play = "trophy_engine.play:main"
trophy-live = "trophy_engine.live:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff==0.14.5",
    "fakeredis>=2.26",
]

[tool.uv.sources]
trophy = { path = "../../packages/py-trophy", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trophy_engine"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
