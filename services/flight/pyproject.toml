[project]
name = "trophy-flight"
version = "0.1.0"
description = "Trophy flight vision module (table tennis): ball detection + gated tracking, rally events. Emits measurements only (D-18)."
requires-python = ">=3.11"
dependencies = [
    "trophy",
    "numpy==1.26.4",
    "opencv-contrib-python-headless==4.10.0.84",
]

[dependency-groups]
dev = ["pytest>=8", "ruff==0.14.5"]

[tool.uv.sources]
trophy = { path = "../../packages/py-trophy", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flight"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-include = ["../../tools/tt_*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"*tt_review.py" = ["E501"]  # the embedded HTML page

[tool.pytest.ini_options]
testpaths = ["tests"]
