[project]
name = "flight"
version = "0.1.0"
description = "Trophy flight: ball track -> field-frame 3D map (field.json + track3d.jsonl) for table tennis."
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy==1.26.4",
    "opencv-python-headless==4.10.0.84",
]

[dependency-groups]
dev = ["pytest>=8", "ruff==0.14.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flight"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
