[project]
name = "trophy-rules"
version = "0.2.0"
description = "Trophy rules service (Agent 3, Part 2): ask the ref (Apify actor dataset -> one Moss index -> Claude, cited and grounding-checked), rule_ref, clauses (interfaces-v1 §17)."
requires-python = ">=3.11"
dependencies = [
    "trophy",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "anthropic>=2.3,<3",
    "moss>=1.21,<2",
    "apify-client>=3.3,<4",
    "pyyaml>=6",
]

[project.scripts]
trophy-rules = "rules.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff==0.14.5",
]

[tool.uv.sources]
trophy = { path = "../../packages/py-trophy", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rules"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query", "fastapi.Body"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: calls Moss or Claude; skipped with a printed reason when the keys are absent"]
